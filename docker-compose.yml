# =============================================================================
#  NODE UTAMA — semua proses ALDx (padanan topologi Tableau Server):
#
#    gateway          nginx: pintu masuk http://localhost:8088, bagi beban ke node web
#    superset         web (Gunicorn)          ~ VizQL Server + Application Server
#    superset-worker  backgrounder (Celery)   ~ Backgrounder
#    superset-beat    penjadwal tugas         ~ Backgrounder scheduler
#    redis            cache & antrean         ~ Cache Server
#    metadb           PostgreSQL: metadata    ~ Repository (PostgreSQL di Tableau)
#    engine           ClickHouse: ALDx Engine  ~ Data Engine (Hyper): ekstrak & upload
#
#  Semua komponen di Docker (tanpa XAMPP). Data metadb & engine disimpan di volume
#  Docker "sps_metadb" & "sps_engine" (tetap ada walau container dihapus).
#  Semua nilai dari .env.
#  Jumlah proses & jatah CPU/RAM diatur dari halaman Pusat Kendali Server lalu
#  diterapkan dengan scripts\terapkan-server.ps1 (mengisi blok SERVER di .env).
#  Node tambahan (scale-out): docker-compose.node.yml + scripts\gabung-node.ps1
# =============================================================================

x-superset: &superset
  build:
    context: ./docker
    args:
      SUPERSET_VERSION: ${SUPERSET_VERSION}
  image: sps-superset:${SUPERSET_VERSION}
  env_file: .env
  volumes:
    # Seluruh folder config/ (superset_config.py + modul sps_*).
    - ./config:/app/pythonpath:ro
    # Logo ALDx, logo unggahan installer & font -> /static/assets/images/sps/
    - ./branding:/app/superset/static/assets/images/sps:ro
    # Sertifikat CA kantor untuk Asisten AI ke model API (lihat certs/README.md).
    - ./certs:/app/certs:ro
    # Panduan di dalam aplikasi (/panduan/): dokumentasi Markdown, gambar & PDF (hanya-baca).
    - ./docs:/app/docs:ro
    - ./CARA-PASANG.md:/app/docs-akar/CARA-PASANG.md:ro
    # Berkas yang ditulis Pusat Kendali (gateway.conf). Satu-satunya mount yang bisa ditulis.
    - ./server:/app/server
  extra_hosts:
    # Agar container bisa menjangkau Ollama/LM Studio di Windows.
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

x-superset-env: &superset-env
  SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
  PYTHONPATH: /app/pythonpath
  REDIS_HOST: redis
  # Di node utama metadata & engine selalu container lokal (nilai .env untuk node tambahan).
  METADB_HOST: metadb
  METADB_PORT: "5432"
  ENGINE_HOST: engine
  ENGINE_PORT: "8123"
  NODE_PERAN: utama
  NODE_NAMA: ${NODE_NAMA:-node-utama}

services:
  redis:
    image: redis:${REDIS_VERSI:-7.4}-alpine
    container_name: sps_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}",
              "--maxmemory", "${REDIS_MEM_MB:-512}mb", "--maxmemory-policy", "allkeys-lru",
              "--save", "", "--appendonly", "no"]
    mem_limit: ${REDIS_MEM_LIMIT:-640m}
    ports:
      # Bawaan hanya komputer ini. Mode multi-node: CLUSTER_BIND=0.0.0.0 (lihat docs/11).
      - "${CLUSTER_BIND:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  metadb:
    # PostgreSQL: database metadata yang direkomendasikan resmi Superset (ringan & cepat).
    image: postgres:${METADB_VERSI:-17}-alpine
    container_name: sps_metadb
    command: ["postgres", "-c", "shared_buffers=${METADB_BUFFER:-128MB}", "-c", "max_connections=300",
              "-c", "effective_cache_size=${METADB_CACHE:-384MB}", "-c", "work_mem=8MB",
              "-c", "maintenance_work_mem=64MB", "-c", "wal_compression=on"]
    environment:
      POSTGRES_DB: ${METADB_DATABASE:-sps_superset}
      POSTGRES_USER: ${METADB_USER:-superset}
      POSTGRES_PASSWORD: ${METADB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    mem_limit: ${METADB_MEM:-512m}
    shm_size: 128m
    volumes:
      - sps_metadb_pg:/var/lib/postgresql/data
      # Berkas cadangan (backup\*.dump) & skrip pemeliharaan (server/metadb/sps.sh).
      - ./backup:/backup
      - ./server/metadb:/sps:ro
    ports:
      # 5433 agar tidak bentrok dengan PostgreSQL lain di komputer (diagnosa & node tambahan).
      - "${CLUSTER_BIND:-127.0.0.1}:${METADB_PORT_HOST:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  # Hanya untuk PINDAH dari versi lama (metadata MariaDB). Tidak menyala kecuali
  # dipanggil scripts\pindah-metadata.ps1 (profil "pindah"). Data lama tidak diubah.
  metadb-lama:
    profiles: ["pindah"]
    image: mariadb:${METADB_VERSI_LAMA:-11.4}
    container_name: sps_metadb_lama
    environment:
      # Dipakai hanya bila volume lama kosong (pindah dari berkas cadangan .sql).
      MARIADB_ROOT_PASSWORD: ${METADB_ROOT_PASSWORD:-sementara}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-sps_superset}
      MARIADB_USER: ${MYSQL_USER:-superset}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-sementara}
    volumes:
      - sps_metadb:/var/lib/mysql
      - ./backup:/backup:ro
      - ./server/metadb:/sps:ro
    healthcheck:
      # "mysqld is alive" sudah cukup: user & password lama dipakai oleh skrip pindah.
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost 2>&1 | grep -q alive"]
      interval: 5s
      retries: 30
    restart: "no"

  engine:
    image: clickhouse/clickhouse-server:${ENGINE_VERSI:-25.8}
    container_name: sps_engine
    environment:
      CLICKHOUSE_DB: ${ENGINE_DATABASE:-sps_engine}
      CLICKHOUSE_USER: ${ENGINE_USER:-sps}
      CLICKHOUSE_PASSWORD: ${ENGINE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    mem_limit: ${ENGINE_MEM:-2g}
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - sps_engine:/var/lib/clickhouse
      # Log ringkas & izin folder cadangan (server/engine/sps.xml).
      - ./server/engine/sps.xml:/etc/clickhouse-server/config.d/sps.xml:ro
      # Skrip pemeliharaan (cadangan/pemulihan) - server/engine/sps.sh.
      - ./server/engine/sps.sh:/sps/sps.sh:ro
      - ./backup/engine:/backups
    ports:
      # HTTP 8123 di container -> 8124 di komputer (untuk node tambahan & diagnosa).
      - "${CLUSTER_BIND:-127.0.0.1}:${ENGINE_PORT_HOST:-8124}:8123"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  superset:
    <<: *superset
    container_name: sps_superset
    command: ["python", "-m", "sps_server.jalankan", "web"]
    environment:
      <<: *superset-env
      NODE_LAYANAN: web
    cpus: ${WEB_CPUS:-2}
    mem_limit: ${WEB_MEM:-3g}
    ports:
      # Akses langsung tanpa gateway, hanya dari komputer ini (untuk diagnosa).
      - "127.0.0.1:${NODE_WEB_PORT:-8089}:8088"
    depends_on:
      redis:
        condition: service_healthy
      metadb:
        condition: service_healthy
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  superset-worker:
    <<: *superset
    container_name: sps_superset_worker
    command: ["python", "-m", "sps_server.jalankan", "worker"]
    # Pemeriksaan kesehatan: proses celery hidup (bukan port web 8088 bawaan image, yang selalu "unhealthy").
    healthcheck:
      test: ["CMD-SHELL", "grep -qa '[c]elery' /proc/[0-9]*/cmdline"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    environment:
      <<: *superset-env
      NODE_LAYANAN: worker
    cpus: ${WORKER_CPUS:-1}
    mem_limit: ${WORKER_MEM:-2g}
    depends_on:
      redis:
        condition: service_healthy
      metadb:
        condition: service_healthy
      engine:
        condition: service_healthy

  superset-beat:
    <<: *superset
    container_name: sps_superset_beat
    command: ["python", "-m", "sps_server.jalankan", "beat"]
    # Pemeriksaan kesehatan: proses celery hidup (bukan port web 8088 bawaan image, yang selalu "unhealthy").
    healthcheck:
      test: ["CMD-SHELL", "grep -qa '[c]elery' /proc/[0-9]*/cmdline"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    environment:
      <<: *superset-env
      NODE_LAYANAN: beat
    mem_limit: ${BEAT_MEM:-256m}
    depends_on:
      redis:
        condition: service_healthy
      metadb:
        condition: service_healthy
      engine:
        condition: service_healthy

  gateway:
    image: nginx:${GATEWAY_VERSI:-1.28}-alpine
    container_name: sps_gateway
    ports:
      - "${SUPERSET_PORT}:80"
    volumes:
      # Dibuat ulang oleh scripts\terapkan-server.ps1 (daftar node web, timeout, ukuran upload).
      - ./server/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      # Sertifikat HTTPS (bila SPS_HTTPS=1): dibuat otomatis atau sertifikat kantor (server/tls/README.md).
      - ./server/tls:/etc/nginx/tls:ro
    depends_on:
      - superset
    restart: unless-stopped

volumes:
  # Metadata PostgreSQL (versi sekarang).
  sps_metadb_pg:
    name: sps_metadb_pg
  # Metadata MariaDB versi lama: dibiarkan sebagai cadangan setelah pindah.
  sps_metadb:
    name: sps_metadb
  sps_engine:
    name: sps_engine
