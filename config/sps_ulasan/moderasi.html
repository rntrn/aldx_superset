<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moderasi ulasan · {{ app_name }}</title>
<link rel="icon" href="/identitas/berkas/favicon">
<link id="sps-tema" rel="stylesheet" href="/identitas/tema.css">
<style>
:root{--navy:var(--sps-utama,#1F4E79);--emas:var(--sps-aksen,#F2A900);--bg:var(--sps-latar,#F4F6F9);--garis:#D5DCE4;--teks:#1F2933;--redup:#5F6B7A;--merah:#B42318;--hijau:#0B7A52}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sps-font,'Plus Jakarta Sans','Segoe UI',Arial,sans-serif);background:var(--bg);color:var(--teks);font-size:13px}
header{background:var(--navy);color:#fff;padding:10px 20px;border-bottom:3px solid var(--emas)}
header .judul{font-weight:700;font-size:15px}header .sub{font-size:11.5px;opacity:.85}
main{max-width:980px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.tab{display:flex;gap:6px}.tab button{border-radius:16px}
button{font:inherit;border-radius:6px;cursor:pointer;padding:6px 12px;border:1px solid var(--navy);background:#fff;color:var(--navy)}
button.utama,.tab button.aktif{background:var(--navy);color:#fff}button.tolak{border-color:var(--merah);color:var(--merah)}
.kartu{background:#fff;border:1px solid var(--garis);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.kartu .atas{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.kartu .atas small{color:var(--redup)}
.kartu p{margin:0;white-space:pre-wrap;line-height:1.45}
.bintang{color:#F2A900}.aksi{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text]{font:inherit;padding:6px 8px;border:1px solid var(--garis);border-radius:6px;min-width:260px;flex:1}
.kosong{color:var(--redup);padding:20px;text-align:center}
a{color:var(--navy)}
.massal{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--garis);border-radius:10px;padding:8px 12px;position:sticky;top:0;z-index:1}
.kartu .atas input[type=checkbox]{width:16px;height:16px}
</style>
</head>
<body>
<header class="sps-hiasan"><div class="judul">Moderasi ulasan</div>
<div class="sub">Komentar & rating baru tampil untuk orang lain setelah Anda setujui. Khusus Superadmin.</div></header>
<main>
  <div class="tab" id="tab">
    <button data-status="menunggu" class="aktif">Menunggu <span id="jml"></span></button>
    <button data-status="tampil">Tampil</button>
    <button data-status="ditolak">Ditolak</button>
  </div>
  <div class="massal" id="massal" hidden>
    <label><input type="checkbox" id="semua"> Pilih semua</label><span id="jmlPilih"></span>
    <button class="utama" data-massal="tampil">Tampilkan terpilih</button>
    <input type="text" id="alasanMassal" placeholder="Alasan menolak (opsional)"><button class="tolak" data-massal="ditolak">Tolak terpilih</button>
  </div>
  <div id="daftar"></div>
</main>
<script nonce="{{ csp_nonce() }}">
(() => {
  "use strict";
  const CSRF = "{{ csrf }}", $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const ALAMAT = {dashboard: id => `/superset/dashboard/${id}/`, chart: id => `/explore/?slice_id=${id}`};
  let status = "menunggu";

  async function muat() {
    const d = await (await fetch(`/ulasan/api/moderasi?status=${status}`, {credentials: "same-origin"})).json();
    $("#jml").textContent = d.menunggu ? `(${d.menunggu})` : "";
    $("#daftar").innerHTML = (d.ulasan || []).map(u => `<div class="kartu" data-id="${u.id}">
      <div class="atas"><input type="checkbox" class="pilih" aria-label="Pilih"><b>${esc(u.nama || u.pengguna)}</b><small>${esc(u.pengguna)} · ${esc(new Date(u.dibuat + "Z").toLocaleString("id-ID"))}</small>
        ${u.nilai ? `<span class="bintang">${"★".repeat(u.nilai)}</span>` : ""}
        <a href="/app/?p=${encodeURIComponent(ALAMAT[u.jenis](u.objek_id))}" target="_top">${esc(u.jenis === "chart" ? "Chart" : "Dashboard")}: ${esc(u.judul)}</a></div>
      ${u.teks ? `<p>${esc(u.teks)}</p>` : ""}
      ${u.moderator ? `<small>Dimoderasi ${esc(u.moderator)}${u.alasan ? ": " + esc(u.alasan) : ""}</small>` : ""}
      <div class="aksi">
        ${u.status !== "tampil" ? '<button class="utama" data-aksi="tampil">Tampilkan</button>' : ""}
        ${u.status !== "ditolak" ? '<input type="text" placeholder="Alasan menolak (dilihat penulis)"><button class="tolak" data-aksi="ditolak">Tolak</button>' : ""}
      </div></div>`).join("") || '<div class="kosong">Tidak ada ulasan.</div>';
    $("#massal").hidden = !(d.ulasan || []).length;
    $("#semua").checked = false; hitung();
  }
  function terpilih() { return [...document.querySelectorAll(".kartu .pilih:checked")].map(c => Number(c.closest(".kartu").dataset.id)); }
  function hitung() { const n = terpilih().length; $("#jmlPilih").textContent = n ? `${n} dipilih` : "";
    document.querySelectorAll("[data-massal]").forEach(b => { b.disabled = !n; }); }
  $("#semua").addEventListener("change", e => { document.querySelectorAll(".kartu .pilih").forEach(c => { c.checked = e.target.checked; }); hitung(); });
  $("#daftar").addEventListener("change", e => { if (e.target.classList.contains("pilih")) hitung(); });
  $("#massal").addEventListener("click", async e => {
    const b = e.target.closest("button[data-massal]"); if (!b) return;
    b.disabled = true;
    await fetch("/ulasan/api/moderasi/massal", {method: "POST", credentials: "same-origin",
      headers: {"Content-Type": "application/json", "X-CSRFToken": CSRF},
      body: JSON.stringify({ids: terpilih(), status: b.dataset.massal, alasan: $("#alasanMassal").value})});
    $("#alasanMassal").value = ""; muat();
  });

  $("#tab").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    status = b.dataset.status;
    document.querySelectorAll("#tab button").forEach(x => x.classList.toggle("aktif", x === b));
    muat();
  });
  $("#daftar").addEventListener("click", async e => {
    const b = e.target.closest("button[data-aksi]");
    if (!b) return;
    const k = b.closest(".kartu"), alasan = (k.querySelector("input") || {}).value || "";
    b.disabled = true;
    await fetch(`/ulasan/api/moderasi/${k.dataset.id}`, {method: "POST", credentials: "same-origin",
      headers: {"Content-Type": "application/json", "X-CSRFToken": CSRF}, body: JSON.stringify({status: b.dataset.aksi, alasan})});
    muat();
  });
  muat();
})();
</script>
</body>
</html>
