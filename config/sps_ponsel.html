<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tata letak ponsel · {{ app_name }}</title>
<link rel="icon" href="/identitas/berkas/favicon">
<link id="sps-tema" rel="stylesheet" href="/identitas/tema.css">
<style>
:root{--navy:var(--sps-utama,#1F4E79);--emas:var(--sps-aksen,#F2A900);--bg:var(--sps-latar,#F4F6F9);--garis:#D5DCE4;--teks:#1F2933;--redup:#5F6B7A;--merah:#B42318;--hijau:#0B7A52}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sps-font,'Plus Jakarta Sans','Segoe UI',Arial,sans-serif);background:var(--bg);color:var(--teks);font-size:13px}
header{background:var(--navy);color:#fff;padding:10px 20px;border-bottom:3px solid var(--emas)}
header .judul{font-weight:700;font-size:15px}header .sub{font-size:11.5px;opacity:.85}
main{max-width:640px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.kartu{background:#fff;border:1px solid var(--garis);border-radius:10px;padding:12px 14px}
.baris{display:flex;align-items:center;gap:10px;padding:8px 4px;border-top:1px solid var(--garis)}
.baris:first-child{border-top:0}.baris .nama{flex:1}.baris.sembunyi .nama{color:var(--redup);text-decoration:line-through}
.no{width:22px;color:var(--redup);text-align:right}
button{font:inherit;border-radius:6px;cursor:pointer;padding:4px 10px;border:1px solid var(--navy);background:#fff;color:var(--navy)}
button.utama{background:var(--navy);color:#fff}button:disabled{opacity:.4;cursor:default}
.aksi{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pesan{min-height:18px}.galat{color:var(--merah)}.sukses{color:var(--hijau)}
.redup{color:var(--redup)}
</style>
</head>
<body>
<header class="sps-hiasan"><div class="judul">Tata letak ponsel</div>
<div class="sub">Urutan & chart yang tampil saat dashboard dibuka di ponsel. Layar lebar tidak berubah.</div></header>
<main>
  <div class="kartu"><b id="judul">Memuat…</b>
    <p class="redup">Atur urutan dengan tombol ↑ ↓. Hilangkan centang untuk menyembunyikan chart di ponsel (mis. tabel lebar).</p></div>
  <div class="kartu" id="daftar"></div>
  <div class="aksi"><button class="utama" id="simpan">Simpan</button><button id="reset">Kembali ke urutan layar lebar</button>
    <span class="pesan" id="pesan"></span></div>
</main>
<script nonce="{{ csp_nonce() }}">
(() => {
  "use strict";
  const CSRF = "{{ csrf }}", $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const id = new URLSearchParams(location.search).get("id");
  let D = null, urutan = [], sembunyi = new Set();
  const pesan = (t, k = "") => { $("#pesan").className = "pesan " + k; $("#pesan").textContent = t; };
  const nama = i => (D.chart.find(c => c.id === i) || {}).nama || `chart #${i}`;

  function gambar() {
    $("#daftar").innerHTML = urutan.map((i, n) => `<div class="baris${sembunyi.has(i) ? " sembunyi" : ""}" data-id="${i}">
      <span class="no">${n + 1}</span><input type="checkbox" ${sembunyi.has(i) ? "" : "checked"} aria-label="Tampil di ponsel">
      <span class="nama">${esc(nama(i))}</span>
      <button data-geser="-1" ${n === 0 ? "disabled" : ""} aria-label="Naik">↑</button>
      <button data-geser="1" ${n === urutan.length - 1 ? "disabled" : ""} aria-label="Turun">↓</button></div>`).join("")
      || '<p class="redup">Dashboard ini belum punya chart.</p>';
    document.querySelectorAll("button, input").forEach(x => { if (!D.boleh_ubah) x.disabled = true; });
  }
  async function muat() {
    const r = await fetch(`/ponsel-dashboard/api/${encodeURIComponent(id)}`, {credentials: "same-origin"});
    D = await r.json().catch(() => ({}));
    if (!r.ok) { $("#judul").textContent = D.error || "Gagal memuat"; return; }
    $("#judul").textContent = D.judul + (D.diatur ? "" : " (belum diatur: memakai urutan layar lebar)");
    urutan = D.urutan.slice(); sembunyi = new Set(D.sembunyi);
    if (!D.boleh_ubah) pesan("Hanya pemilik dashboard atau Admin yang boleh mengubah.", "galat");
    gambar();
  }
  $("#daftar").addEventListener("click", e => {
    const b = e.target.closest("[data-geser]"); if (!b) return;
    const i = urutan.indexOf(Number(b.closest(".baris").dataset.id)), j = i + Number(b.dataset.geser);
    [urutan[i], urutan[j]] = [urutan[j], urutan[i]]; gambar();
  });
  $("#daftar").addEventListener("change", e => {
    const i = Number(e.target.closest(".baris").dataset.id);
    e.target.checked ? sembunyi.delete(i) : sembunyi.add(i); gambar();
  });
  async function kirim(isi, ok) {
    const r = await fetch(`/ponsel-dashboard/api/${D.id}`, {method: "POST", credentials: "same-origin",
      headers: {"Content-Type": "application/json", "X-CSRFToken": CSRF}, body: JSON.stringify(isi)});
    const d = await r.json().catch(() => ({}));
    r.ok ? pesan(ok, "sukses") : pesan(d.error || "Gagal menyimpan", "galat");
    if (r.ok) muat();
  }
  $("#simpan").onclick = () => kirim({urutan, sembunyi: [...sembunyi]}, "Tersimpan. Buka dashboard di ponsel untuk melihatnya.");
  $("#reset").onclick = () => kirim({hapus: true}, "Kembali memakai urutan layar lebar.");
  muat();
})();
</script>
</body>
</html>
