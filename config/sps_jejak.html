<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jejak data · {{ app_name }}</title>
<link rel="icon" href="/identitas/berkas/favicon">
<link id="sps-tema" rel="stylesheet" href="/identitas/tema.css">
<style>
:root{--navy:var(--sps-utama,#1F4E79);--emas:var(--sps-aksen,#F2A900);--bg:var(--sps-latar,#F4F6F9);--garis:#D5DCE4;--teks:#1F2933;--redup:#5F6B7A}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sps-font,'Plus Jakarta Sans','Segoe UI',Arial,sans-serif);background:var(--bg);color:var(--teks);font-size:13px}
header{background:var(--navy);color:#fff;padding:10px 20px;border-bottom:3px solid var(--emas)}
header .judul{font-weight:700;font-size:15px}header .sub{font-size:11.5px;opacity:.85}
main{display:grid;grid-template-columns:280px 1fr;gap:12px;padding:16px;max-width:1500px;margin:0 auto}
.kartu{background:#fff;border:1px solid var(--garis);border-radius:10px;padding:12px 14px;min-width:0}
input{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--garis);border-radius:6px}
.daftar{margin-top:8px;max-height:calc(100vh - 170px);overflow:auto;display:flex;flex-direction:column;gap:2px}
.daftar button{font:inherit;text-align:left;border:0;background:transparent;border-radius:6px;padding:6px 8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;color:var(--teks)}
.daftar button:hover{background:var(--bg)}.daftar button.aktif{background:var(--navy);color:#fff}
.daftar button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lencana{font-size:11px;border-radius:10px;padding:1px 7px;background:var(--bg);color:var(--redup);flex:none}
.aktif .lencana{background:rgba(255,255,255,.22);color:#fff}
.alur{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.kolom h3{margin:0 0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--redup);display:flex;justify-content:space-between}
.simpul{display:block;border:1px solid var(--garis);border-radius:8px;padding:8px 10px;margin-bottom:6px;background:#fff;color:inherit;text-decoration:none;border-left:3px solid var(--navy)}
a.simpul:hover{border-color:var(--navy);background:var(--bg)}
.simpul b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.simpul small{color:var(--redup)}
.simpul.sorot{border-left-color:var(--emas);background:#FFFBEF}.simpul.pudar{opacity:.35}
.ringkas{margin:0 0 12px;color:var(--redup)}.ringkas b{color:var(--teks)}
.kosong{color:var(--redup);padding:8px 0}
@media (max-width:900px){main{grid-template-columns:1fr}.alur{grid-template-columns:1fr}.daftar{max-height:220px}}
</style>
</head>
<body>
<header class="sps-hiasan"><div class="judul">Jejak data</div>
<div class="sub">Dari mana sebuah dataset berasal dan dipakai di chart & dashboard mana. Periksa di sini sebelum mengubah atau menghapus dataset.</div></header>
<main>
  <div class="kartu">
    <input id="cari" placeholder="Cari dataset" autocomplete="off">
    <div class="daftar" id="daftar"></div>
  </div>
  <div class="kartu" id="hasil"><p class="kosong">Pilih dataset di kiri untuk melihat jejaknya.</p></div>
</main>
<script nonce="{{ csp_nonce() }}">
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const ambil = u => fetch(u, {credentials: "same-origin"}).then(r => r.json());
  let dipilih = null, tunda;

  async function muatDaftar(q = "") {
    const d = (await ambil("/jejak-data/api/daftar?q=" + encodeURIComponent(q))).dataset || [];
    $("#daftar").innerHTML = d.map(x => `<button type="button" data-id="${x.id}" class="${x.id === dipilih ? "aktif" : ""}" title="${esc(x.keterangan)}">
      <span>${esc(x.nama)}</span><span class="lencana">${x.chart} chart</span></button>`).join("") || '<p class="kosong">Tidak ada dataset yang cocok.</p>';
    document.querySelectorAll("#daftar [data-id]").forEach(b => b.onclick = () => buka(+b.dataset.id));
  }

  // Empat kolom: Sumber -> Dataset -> Chart -> Dashboard. Arahkan kursor ke chart/dashboard untuk menyorot pasangannya.
  async function buka(id) {
    dipilih = id;
    document.querySelectorAll("#daftar [data-id]").forEach(b => b.classList.toggle("aktif", +b.dataset.id === id));
    $("#hasil").innerHTML = '<p class="kosong">Memuat…</p>';
    const j = await ambil(`/jejak-data/api/jejak/${id}`);
    if (j.error) { $("#hasil").innerHTML = `<p class="kosong">${esc(j.error)}</p>`; return; }
    const ds = j.dataset, s = j.sumber;
    $("#hasil").innerHTML = `<p class="ringkas">Mengubah atau menghapus <b>${esc(ds.nama)}</b> berdampak pada <b>${j.chart.length} chart</b> dan
        <b>${j.dashboard.length} dashboard</b>${j.tersembunyi ? ` (+ ${j.tersembunyi} chart milik orang lain yang tidak boleh Anda lihat)` : ""}.</p>
      <div class="alur">
        <div class="kolom"><h3>Sumber</h3>
          <div class="simpul"><b>${esc(s.database)}</b><small>database${s.skema ? " · skema " + esc(s.skema) : ""}</small></div>
          ${s.tabel.map(n => `<div class="simpul"><b>${esc(n)}</b><small>tabel${s.virtual ? " (dibaca oleh SQL dataset)" : ""}</small></div>`).join("")
            || '<p class="kosong">Dataset SQL; daftar tabel tidak terbaca.</p>'}</div>
        <div class="kolom"><h3>Dataset</h3>
          <a class="simpul sorot" href="${esc(ds.url)}"><b>${esc(ds.nama)}</b>
            <small>${s.virtual ? "virtual (SQL)" : "fisik"} · ${ds.kolom} kolom · ${ds.metrik} metrik<br>
            ${ds.pemilik.length ? "pemilik: " + esc(ds.pemilik.join(", ")) + "<br>" : ""}diubah ${esc(ds.diubah)}</small></a></div>
        <div class="kolom"><h3>Chart <span>${j.chart.length}</span></h3>
          ${j.chart.map(c => `<a class="simpul" data-c="${c.id}" data-d="${c.dashboard.join(",")}" href="${esc(c.url)}"><b>${esc(c.judul)}</b>
            <small>${esc(c.jenis)} · ${c.dashboard.length ? c.dashboard.length + " dashboard" : "belum dipakai di dashboard"}</small></a>`).join("")
            || '<p class="kosong">Belum ada chart dari dataset ini.</p>'}</div>
        <div class="kolom"><h3>Dashboard <span>${j.dashboard.length}</span></h3>
          ${j.dashboard.map(d => `<a class="simpul" data-dash="${d.id}" href="${esc(d.url)}"><b>${esc(d.judul)}</b>
            <small>${d.chart} chart dari dataset ini · ${d.terbit ? "terbit" : "draf"}</small></a>`).join("")
            || '<p class="kosong">Belum dipakai di dashboard.</p>'}</div>
      </div>`;
    const semua = [...document.querySelectorAll("[data-c],[data-dash]")];
    const sorot = cocok => semua.forEach(e => e.classList.toggle("pudar", cocok && !cocok(e)));
    document.querySelectorAll("[data-c]").forEach(e => {
      const d = e.dataset.d ? e.dataset.d.split(",") : [];
      e.onmouseenter = () => sorot(x => x === e || d.includes(x.dataset.dash));
      e.onmouseleave = () => sorot(null);
    });
    document.querySelectorAll("[data-dash]").forEach(e => {
      e.onmouseenter = () => sorot(x => x === e || (x.dataset.d || "").split(",").includes(e.dataset.dash));
      e.onmouseleave = () => sorot(null);
    });
  }

  $("#cari").addEventListener("input", e => { clearTimeout(tunda); tunda = setTimeout(() => muatDaftar(e.target.value), 250); });
  muatDaftar().then(() => { const id = Number(new URLSearchParams(location.search).get("dataset")); if (id) buka(id); });
})();
</script>
</body>
</html>
