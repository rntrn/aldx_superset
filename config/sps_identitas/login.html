<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk · {{ n.nama_aplikasi }}</title>
<link rel="icon" href="/identitas/berkas/favicon?v={{ v }}">
<link id="sps-tema" rel="stylesheet" href="/identitas/tema.css?v={{ v }}">
<style>
/* Halaman login SPS. Warna & motif dari /identitas/tema.css (Pusat Kendali > Identitas & Tema). */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sps-font);color:#1F2933;background:var(--sps-latar);display:grid;
  grid-template-columns:minmax(0,1.35fr) minmax(380px,1fr);min-height:100vh}

/* ---------- Panggung kiri: identitas + ilustrasi data ---------- */
.panggung{position:relative;overflow:hidden;color:#fff;background:var(--sps-utama-gelap);
  display:flex;flex-direction:column;padding:40px 56px 32px;isolation:isolate}
.gumpal{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;z-index:-2}
.g1{width:520px;height:520px;background:var(--sps-utama-terang);top:-160px;left:-120px;animation:melayang1 22s ease-in-out infinite}
.g2{width:420px;height:420px;background:var(--sps-aksen);bottom:-180px;right:-80px;opacity:.35;animation:melayang2 26s ease-in-out infinite}
.g3{width:300px;height:300px;background:var(--sps-utama);top:40%;left:45%;animation:melayang3 30s ease-in-out infinite}
@keyframes melayang1{50%{transform:translate(120px,80px) scale(1.1)}}
@keyframes melayang2{50%{transform:translate(-100px,-60px) scale(.9)}}
@keyframes melayang3{50%{transform:translate(-80px,90px) scale(1.15)}}
.motif{position:absolute;inset:0;z-index:-1;opacity:.5;background-image:var(--sps-pola);
  background-size:var(--sps-pola-ukuran);animation:geser 60s linear infinite}
@keyframes geser{to{background-position:480px 240px}}
.logo{height:44px;max-width:240px;object-fit:contain;object-position:left}
.isi{margin:auto 0;max-width:560px}
.isi h1{font-size:clamp(34px,4.2vw,56px);line-height:1.05;font-weight:800;margin:0 0 14px;letter-spacing:-.02em}
.isi p{font-size:18px;line-height:1.5;margin:0;opacity:.85}
.perusahaan{display:inline-block;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  color:var(--sps-aksen);margin-bottom:18px}
.kaki{font-size:12.5px;opacity:.65}

/* Ilustrasi: kartu chart kecil yang "hidup" (batang tumbuh, garis tren tergambar, titik berdenyut). */
.ilustrasi{margin-top:40px;width:min(440px,100%);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  border-radius:16px;padding:18px 20px 14px;backdrop-filter:blur(6px)}
.ilustrasi .atas{display:flex;justify-content:space-between;font-size:12px;opacity:.8;margin-bottom:6px}
.angka-semu{display:flex;gap:10px;align-items:center;margin:4px 0 8px}
.angka-semu i{display:block;height:14px;border-radius:7px;background:rgba(255,255,255,.35)}
.angka-semu i:first-child{width:110px;height:20px}.angka-semu i:last-child{width:46px;background:var(--sps-aksen);opacity:.8}
.ilustrasi svg{display:block;width:100%;height:auto}
.btg{transform-box:fill-box;transform-origin:bottom;animation:tumbuh .9s cubic-bezier(.2,.8,.2,1) both,
  napas 6s ease-in-out 1.6s infinite}
@keyframes tumbuh{from{transform:scaleY(0)}}
@keyframes napas{50%{transform:scaleY(.86)}}
.tren{stroke-dasharray:420;stroke-dashoffset:420;animation:gambar 1.6s ease-out .7s forwards}
@keyframes gambar{to{stroke-dashoffset:0}}
.denyut{transform-box:fill-box;transform-origin:center;animation:denyut 2.4s ease-out 2.2s infinite}
@keyframes denyut{0%{transform:scale(1);opacity:.9}70%{transform:scale(3.2);opacity:0}100%{opacity:0}}

/* ---------- Formulir kanan ---------- */
.formulir{display:flex;align-items:center;justify-content:center;padding:40px 24px;position:relative}
.kartu{width:100%;max-width:380px;animation:masuk .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes masuk{from{opacity:0;transform:translateY(16px)}}
.kartu h2{font-size:28px;margin:0 0 6px;color:var(--sps-utama);font-weight:800}
.kartu .sapa{margin:0 0 26px;color:#5F6B7A;font-size:14.5px;line-height:1.5}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:#374151}
.kolom{position:relative;margin-bottom:18px}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:15px;padding:12px 14px;border:1.5px solid #D5DCE4;
  border-radius:var(--sps-sudut);background:#fff;color:#111827;transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--sps-utama);box-shadow:0 0 0 4px var(--sps-utama-muda)}
.lihat{position:absolute;right:8px;bottom:8px;border:0;background:none;font:inherit;font-size:12.5px;font-weight:600;
  color:var(--sps-utama);cursor:pointer;padding:6px 8px;border-radius:6px}
.lihat:hover{background:var(--sps-utama-muda)}
.capslock{display:none;font-size:12px;color:#B45309;margin-top:6px}
.tombol{width:100%;margin-top:6px;font:inherit;font-weight:700;font-size:15px;padding:13px;border:0;cursor:pointer;
  border-radius:var(--sps-sudut);background:var(--sps-utama);color:var(--sps-teks-utama);position:relative;overflow:hidden;
  transition:transform .15s,box-shadow .2s,background .2s}
.tombol:hover{background:var(--sps-utama-terang);box-shadow:0 8px 22px -10px var(--sps-utama);transform:translateY(-1px)}
.tombol:active{transform:translateY(0)}
.tombol::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);
  transform:translateX(-100%)}
.tombol:hover::after{animation:kilau .9s ease}
@keyframes kilau{to{transform:translateX(100%)}}
.tombol .putar{display:none;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;
  border-radius:50%;vertical-align:-3px;margin-right:8px;animation:putar .7s linear infinite}
.tombol.muat .putar{display:inline-block}
@keyframes putar{to{transform:rotate(360deg)}}
.galat{background:#FDECEC;border:1px solid #F5C2C0;color:#9B1C1C;padding:11px 14px;border-radius:var(--sps-sudut);
  font-size:13.5px;margin-bottom:18px;animation:goyang .45s ease}
@keyframes goyang{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.klasik{display:block;text-align:center;margin-top:22px;font-size:12px;color:#8A94A3;text-decoration:none}
.klasik:hover{color:var(--sps-utama)}

/* ---------- Layar kecil ---------- */
@media (max-width:860px){
  body{grid-template-columns:1fr}
  .panggung{padding:28px 24px 30px;min-height:auto}
  .isi{margin:26px 0 0}.isi h1{font-size:32px}.isi p{font-size:15px}
  .ilustrasi,.kaki{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .tren{stroke-dashoffset:0}
}
{% if not n.animasi %}*,*::before,*::after{animation:none!important}.tren{stroke-dashoffset:0}{% endif %}
</style>
</head>
<body>
<section class="panggung" aria-hidden="false">
  <div class="gumpal g1"></div><div class="gumpal g2"></div><div class="gumpal g3"></div><div class="motif"></div>
  <img class="logo" src="/identitas/berkas/logo_putih?v={{ v }}" alt="{{ n.nama_perusahaan }}">
  <div class="isi">
    <span class="perusahaan">{{ n.nama_perusahaan }}</span>
    <h1>{{ n.nama_aplikasi }}</h1>
    <p>{{ n.slogan }}</p>
    <div class="ilustrasi" aria-hidden="true">
      <!-- Ilustrasi tanpa angka (U19): tidak boleh terbaca sebagai data nyata. -->
      <div class="atas"><span>Contoh tampilan</span></div>
      <div class="angka-semu"><i></i><i></i></div>
      <svg viewBox="0 0 400 120">
        {% for t in [38, 54, 46, 70, 62, 84, 78, 100] %}
        <rect class="btg" x="{{ 8 + loop.index0 * 49 }}" y="{{ 116 - t }}" width="30" height="{{ t }}" rx="5"
              fill="rgba(255,255,255,{{ 0.22 + loop.index0 * 0.06 }})" style="animation-delay:{{ loop.index0 * 0.08 }}s,{{ 1.6 + loop.index0 * 0.3 }}s"/>
        {% endfor %}
        <polyline class="tren" points="23,80 72,66 121,72 170,48 219,56 268,34 317,40 366,14" fill="none"
                  stroke="{{ p.aksen }}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="366" cy="14" r="5" fill="{{ p.aksen }}"/>
        <circle class="denyut" cx="366" cy="14" r="5" fill="{{ p.aksen }}"/>
      </svg>
    </div>
  </div>
  <div class="kaki">{{ kaki }}</div>
</section>

<main class="formulir">
  <form class="kartu" method="post" action="{{ aksi }}" id="formMasuk" autocomplete="on">
    <h2>Masuk</h2>
    <p class="sapa">{{ n.teks_login }}</p>
    <div role="alert" aria-live="polite">
      {% for m in pesan %}<div class="galat">{{ m }}</div>{% endfor %}
    </div>
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <div class="kolom">
      <label for="username">Email atau nama pengguna</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="kolom">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="button" class="lihat" id="lihat" aria-controls="password">Lihat</button>
    </div>
    <div class="capslock" id="capslock">Caps Lock menyala.</div>
    <button type="submit" class="tombol" id="tombol"><span class="putar"></span><span>Masuk</span></button>
    <a class="klasik" href="/login/?klasik=1">Tampilan login klasik</a>
  </form>
</main>

<script nonce="{{ csp_nonce() }}">
(function () {
  var pw = document.getElementById("password"), lihat = document.getElementById("lihat");
  lihat.addEventListener("click", function () {
    var tampil = pw.type === "password";
    pw.type = tampil ? "text" : "password";
    lihat.textContent = tampil ? "Sembunyikan" : "Lihat";
    pw.focus();
  });
  pw.addEventListener("keyup", function (e) {
    document.getElementById("capslock").style.display =
      e.getModifierState && e.getModifierState("CapsLock") ? "block" : "none";
  });
  document.getElementById("formMasuk").addEventListener("submit", function () {
    var t = document.getElementById("tombol");
    t.classList.add("muat"); t.lastChild.textContent = "Memeriksa…";
    setTimeout(function () { t.disabled = true; }, 0);   // cegah klik ganda tanpa membatalkan kiriman
  });
})();
</script>
</body>
</html>
