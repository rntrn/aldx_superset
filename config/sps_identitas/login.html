<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk · {{ n.nama_aplikasi }}</title>
<link rel="icon" href="/identitas/berkas/favicon?v={{ v }}">
<link id="sps-tema" rel="stylesheet" href="/identitas/tema.css?v={{ v }}">
<style>
/* Halaman login ALDx "Tebasan": kanvas gradasi hitam -> abu yang bersih, dipotong diagonal oleh sayatan aksen.
   Semua warna dari /identitas/tema.css (Pusat Kendali > Identitas & Tema), jadi berlaku untuk setiap preset. */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sps-font);color:#18181B;background:var(--sps-utama-gelap);min-height:100vh;overflow-x:hidden;
  --panel:42vw;--miring:9vw}                     /* lebar panel formulir & lebar kemiringan potongan diagonal */

/* ---------- Kanvas kiri: bersih. Gradasi hitam -> abu, kilau lembut yang melintas, dan garis data yang hidup. ---------- */
.kanvas{position:fixed;inset:0;color:#fff;isolation:isolate;overflow:hidden;
  background:linear-gradient(150deg,var(--sps-utama-gelap) 0%,var(--sps-utama) 42%,var(--sps-utama-terang) 100%)}
.kanvas::before{content:"";position:absolute;top:-20%;bottom:-20%;left:-40%;width:34%;z-index:-1;      /* kilau diagonal */
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);transform:skewX(-12deg);
  animation:kilau 9s cubic-bezier(.45,0,.55,1) 1.2s infinite}
@keyframes kilau{to{left:110%}}
.logo{position:absolute;top:36px;left:48px;height:40px;max-width:340px;object-fit:contain;object-position:left;
  animation:muncul .9s cubic-bezier(.16,1,.3,1) both}
.pesan{position:absolute;left:48px;bottom:72px;width:min(460px,calc(100vw - var(--panel) - var(--miring) - 96px));
  animation:muncul .9s cubic-bezier(.16,1,.3,1) .25s both}
@keyframes muncul{from{opacity:0;transform:translateY(14px)}}
.perusahaan{display:block;font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;
  color:var(--sps-aksen-terang,var(--sps-aksen));margin-bottom:12px}
.slogan{margin:0;font-size:clamp(22px,2.1vw,32px);font-weight:700;line-height:1.25;letter-spacing:-.02em;color:#fff}
/* Garis data: tiga kurva tipis tergambar bergantian; satu titik cahaya terus melaju di kurva aksen. */
.arus{position:absolute;left:0;top:22%;width:calc(100vw - var(--panel) - var(--miring) / 2);height:46%}
.arus path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;
  animation:gambar 2.6s cubic-bezier(.65,0,.35,1) forwards}
.arus .a1{stroke:rgba(255,255,255,.14);stroke-width:1.2;animation-delay:.3s}
.arus .a2{stroke:rgba(255,255,255,.26);stroke-width:1.2;animation-delay:.55s}
.arus .a3{stroke:var(--sps-aksen);stroke-width:2;animation-delay:.8s}
.arus .komet{stroke:#fff;stroke-width:3;stroke-dasharray:.035 .965;stroke-dashoffset:1.035;opacity:0;
  filter:drop-shadow(0 0 6px var(--sps-aksen));animation:komet 5.5s linear 3.4s infinite}
@keyframes gambar{to{stroke-dashoffset:0}}
@keyframes komet{0%{stroke-dashoffset:1.035;opacity:0}6%{opacity:1}94%{opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.tepi{display:none}
.kaki{position:absolute;left:48px;bottom:26px;font-size:12px;color:rgba(255,255,255,.45);letter-spacing:.02em}

/* ---------- Panel kanan, dipotong diagonal ---------- */
.panel{position:relative;margin-left:auto;width:calc(var(--panel) + var(--miring));min-height:100vh;display:flex;
  align-items:center;justify-content:center;padding:48px 56px 48px calc(var(--miring) + 40px);background:var(--sps-latar);
  clip-path:polygon(var(--miring) 0,100% 0,100% 100%,0 100%)}
.sayatan{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
.sayatan line{stroke:var(--sps-aksen);stroke-width:7;stroke-dasharray:1;stroke-dashoffset:1;
  animation:tebas .8s cubic-bezier(.7,0,.2,1) .15s forwards;filter:drop-shadow(0 0 12px var(--sps-aksen))}
@keyframes tebas{to{stroke-dashoffset:0}}
.kartu{width:100%;max-width:380px;animation:masuk .8s cubic-bezier(.16,1,.3,1) .35s both}
@keyframes masuk{from{opacity:0;transform:translateX(24px)}}
.kartu h2{font-size:40px;line-height:1;margin:0;color:var(--sps-utama);font-weight:800;letter-spacing:-.03em}
.kartu h2::after{content:"";display:block;width:56px;height:5px;margin-top:14px;background:var(--sps-aksen);
  transform:skewX(-24deg);transform-origin:left}
.kartu .sapa{margin:18px 0 34px;color:#52525B;font-size:14.5px;line-height:1.55}
label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px;color:#52525B}
.kolom{position:relative;margin-bottom:26px}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:16px;padding:10px 2px;border:0;
  border-bottom:2px solid #D4D4D8;border-radius:0;background:transparent;color:#18181B}
input:focus{outline:none}
.kolom::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--sps-aksen);
  transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.16,1,.3,1)}
.kolom:focus-within::after{transform:scaleX(1)}
.lihat{position:absolute;right:0;bottom:8px;border:0;background:none;font:inherit;font-size:12px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--sps-utama);cursor:pointer;padding:6px 4px}
.lihat:hover,.lihat:focus-visible{color:var(--sps-aksen);outline:none}
.capslock{display:none;font-size:12px;color:#B45309;margin-top:-16px;margin-bottom:18px}
.tombol{width:100%;margin-top:10px;font:inherit;font-weight:700;font-size:15px;letter-spacing:.04em;padding:16px 20px;
  border:0;cursor:pointer;border-radius:var(--sps-sudut);background:var(--sps-utama);color:var(--sps-teks-utama);
  display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden;isolation:isolate;
  transition:transform .15s,color .3s}
.tombol::before{content:"";position:absolute;inset:0 -20%;z-index:-1;background:var(--sps-aksen);
  transform:translateX(-101%) skewX(-18deg);transition:transform .45s cubic-bezier(.16,1,.3,1)}
.tombol:hover::before,.tombol:focus-visible::before{transform:translateX(0) skewX(-18deg)}
.tombol:hover,.tombol:focus-visible{color:var(--sps-teks-aksen);outline:none}
.tombol:active{transform:scale(.985)}
.panah{font-size:18px;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.tombol:hover .panah{transform:translateX(6px)}
.tombol .putar{display:none;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;
  border-radius:50%;margin-right:10px;vertical-align:-3px;animation:putar .7s linear infinite}
.tombol.muat .putar{display:inline-block}
.tombol.muat .panah{display:none}
@keyframes putar{to{transform:rotate(360deg)}}
.galat{border-left:4px solid #DC2626;background:#FEF2F2;color:#991B1B;padding:11px 14px;font-size:13.5px;margin-bottom:22px;
  animation:goyang .45s ease}
@keyframes goyang{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.klasik{display:inline-block;margin-top:26px;font-size:12px;color:#71717A;text-decoration:none;border-bottom:1px solid transparent}
.klasik:hover,.klasik:focus-visible{color:var(--sps-aksen);border-bottom-color:currentColor;outline:none}

/* ---------- Layar kecil: kanvas jadi kepala bermiring, formulir di bawah ---------- */
@media (max-width:900px){
  body{background:var(--sps-latar)}
  .kanvas{position:relative;clip-path:polygon(0 0,100% 0,100% 84%,0 100%)}
  .logo{top:24px;left:24px;height:34px}
  .arus,.kaki,.sayatan{display:none}
  .kanvas{height:220px}
  .tepi{display:block;position:absolute;left:0;bottom:0;width:100%;height:16%}
  .tepi line{stroke:var(--sps-aksen);stroke-width:9;vector-effect:non-scaling-stroke}
  .pesan{left:24px;right:24px;width:auto;bottom:56px}
  .slogan{font-size:20px}
  .panel{width:100%;min-height:auto;clip-path:none;padding:28px 24px 44px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .arus path,.sayatan line{stroke-dashoffset:0}.arus .komet{display:none}
}
{% if not n.animasi %}*,*::before,*::after{animation:none!important}.arus path,.sayatan line{stroke-dashoffset:0}.arus .komet{display:none}{% endif %}
</style>
</head>
<body>
<section class="kanvas" aria-label="{{ n.nama_aplikasi }}">
  <img class="logo" src="/identitas/berkas/logo_putih?v={{ v }}" alt="{{ n.nama_aplikasi }}">
  <!-- Garis data abstrak (tanpa angka: tidak boleh terbaca sebagai data nyata). -->
  <svg class="arus" viewBox="0 0 1000 400" preserveAspectRatio="none" aria-hidden="true">
    <path class="a1" pathLength="1" d="M0 330 C140 310 220 350 340 300 S560 250 660 270 S860 190 1000 170"/>
    <path class="a2" pathLength="1" d="M0 290 C120 300 240 240 360 250 S540 170 680 190 S880 110 1000 90"/>
    <path class="a3" pathLength="1" d="M0 250 C150 230 230 260 350 190 S570 150 670 110 S870 60 1000 20"/>
    <path class="komet" pathLength="1" d="M0 250 C150 230 230 260 350 190 S570 150 670 110 S870 60 1000 20"/>
  </svg>
  <div class="pesan">
    {% if n.nama_perusahaan %}<span class="perusahaan">{{ n.nama_perusahaan }}</span>{% endif %}
    <p class="slogan">{{ n.slogan }}</p>
  </div>
  <div class="kaki">{{ kaki }}</div>
  <svg class="tepi" viewBox="0 0 100 16" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="16" x2="100" y2="0"/></svg>
</section>
<!-- Sayatan aksen sepanjang potongan diagonal panel (dari atas ke bawah). -->
<svg class="sayatan" aria-hidden="true"><line pathLength="1" x1="0" y1="0" x2="0" y2="0"/></svg>

<main class="panel">
  <form class="kartu" method="post" action="{{ aksi }}" id="formMasuk" autocomplete="on">
    <h2>Masuk</h2>
    <p class="sapa">{{ n.teks_login }}</p>
    <div role="alert" aria-live="polite">
      {% for m in pesan %}<div class="galat">{{ m }}</div>{% endfor %}
    </div>
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <div class="kolom">
      <label for="username">Email atau nama pengguna</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="kolom">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="button" class="lihat" id="lihat" aria-controls="password">Lihat</button>
    </div>
    <div class="capslock" id="capslock">Caps Lock menyala.</div>
    <button type="submit" class="tombol" id="tombol"><span><span class="putar"></span><span id="teksTombol">Masuk</span></span><span class="panah" aria-hidden="true">→</span></button>
    <a class="klasik" href="/login/?klasik=1">Tampilan login klasik</a>
  </form>
</main>

<script nonce="{{ csp_nonce() }}">
(function () {
  // Sayatan menempel di tepi diagonal panel: atas di (lebar - panel), bawah di (lebar - panel - miring).
  // Angka sama dengan --panel (42vw) & --miring (9vw) di CSS.
  var garis = document.querySelector(".sayatan line");
  function letakkan() {
    var lebar = window.innerWidth, panel = lebar * 0.42, miring = lebar * 0.09;
    garis.setAttribute("x1", lebar - panel); garis.setAttribute("y1", 0);
    garis.setAttribute("x2", lebar - panel - miring); garis.setAttribute("y2", window.innerHeight);
  }
  letakkan(); window.addEventListener("resize", letakkan);

  var pw = document.getElementById("password"), lihat = document.getElementById("lihat");
  lihat.addEventListener("click", function () {
    var tampil = pw.type === "password";
    pw.type = tampil ? "text" : "password";
    lihat.textContent = tampil ? "Sembunyikan" : "Lihat";
    pw.focus();
  });
  pw.addEventListener("keyup", function (e) {
    document.getElementById("capslock").style.display =
      e.getModifierState && e.getModifierState("CapsLock") ? "block" : "none";
  });
  document.getElementById("formMasuk").addEventListener("submit", function () {
    var t = document.getElementById("tombol");
    t.classList.add("muat"); document.getElementById("teksTombol").textContent = "Memeriksa…";
    setTimeout(function () { t.disabled = true; }, 0);   // cegah klik ganda tanpa membatalkan kiriman
  });
})();
</script>
</body>
</html>
