# =============================================================================
#  ATURAN HAK AKSES DATA BERBASIS PROFIL (OPSIONAL, dibaca config/sps_akses.py)
#
#  Bawaan: TIDAK dipakai. Hak akses data diatur per role lewat
#  Settings > Row Level Security (lihat docs/08-hak-akses-data.md).
#
#  Dipakai bila perusahaan punya tabel profil (mis. karyawan + cabang) dan ingin
#  setiap orang otomatis hanya melihat data miliknya:
#    1. Hubungkan database sumber profil (Pusat Kendali > Hubungkan data).
#    2. Isi `profil` di bawah: nama koneksi + query 1 baris dengan parameter :username
#       (username login). Nama kolom hasil query = nama atribut (huruf kecil).
#    3. Tulis `aturan`: dicocokkan dari ATAS ke BAWAH; aturan PERTAMA yang cocok dipakai.
#
#  kapan   : syarat profil. Semua syarat harus cocok (DAN). Nilai boleh daftar
#            (cukup salah satu cocok). Huruf besar/kecil tidak dibedakan. Kosong ({}) = semua orang.
#  lingkup : data apa yang boleh dilihat.
#            semua                    -> tanpa batas
#            [wilayah, cabang]        -> dibatasi nilai atribut itu MILIK PENGGUNA
#            {wilayah: ["W1", "W2"]}  -> dibatasi nilai tetap (untuk pengecualian)
#  peran   : role Superset tambahan (hak akses dashboard). Role berawalan `awalan_peran`
#            dikelola otomatis setiap login.
#
#  Di dataset, pasang aturan RLS:  {{ sps_akses(wilayah='KD_WILAYAH', cabang='KD_CABANG') }}
#  Perubahan file ini berlaku untuk login BERIKUTNYA (tanpa restart).
#  Tidak ada aturan yang cocok -> tidak melihat data apa pun (aman secara default).
# =============================================================================

profil:
  database: ""        # nama koneksi di Superset, mis. "HR Karyawan" (bisa juga AKSES_DATABASE di .env)
  sql: ""             # contoh:
  #   SELECT ID_KARYAWAN AS id, NAMA AS nama, KD_WILAYAH AS wilayah, KD_CABANG AS cabang,
  #          TIPE_KANTOR AS tipe_kantor, JABATAN AS jabatan
  #   FROM KARYAWAN WHERE ID_KARYAWAN = :username

awalan_peran: "Akses "

# Per orang (username login). Menimpa aturan umum. Contoh:
#   "budi.santoso": {lingkup: {wilayah: ["W1", "W2"]}, peran: ["Akses Wilayah"]}
pengecualian: {}

aturan: []
# Contoh (hapus tanda # dan sesuaikan dengan atribut profil Anda):
#  - nama: Kantor pusat
#    kapan: {tipe_kantor: PUSAT}
#    lingkup: semua
#    peran: ["Akses Pusat"]
#
#  - nama: Kepala wilayah
#    kapan: {tipe_kantor: WILAYAH}
#    lingkup: [wilayah]
#    peran: ["Akses Wilayah"]
#
#  - nama: Staf cabang
#    kapan: {tipe_kantor: CABANG}
#    lingkup: [wilayah, cabang]
#    peran: ["Akses Cabang"]
