# Membangun & menerbitkan installer ALDx di setiap perubahan cabang main (atau manual: Actions > rilis > Run workflow).
#
#   online   (Windows)  ALDx-Setup.exe + ALDx-HapusTotal.exe            -> Releases > "terbaru"
#   image    (Linux)    image Docker ALDx + PostgreSQL/ClickHouse/Redis/nginx (docker save) + Docker Desktop Installer
#   offline  (Windows)  ALDx-Setup-Offline.exe + ALDx-Setup-Offline-N.bin -> Releases > "offline" (pasang tanpa internet)
#
# Pembangunnya sama dengan di komputer pengembang: installer\setup\buat-installer.ps1 (periksa isi installer:
# berkas wajib ada, .env/log/perkakas tidak ikut). Versi = VERSI di config/sps_versi_aplikasi.py.
# Berkas rilis lama baru dihapus SETELAH berkas baru terunggah, jadi Releases tidak pernah kosong.
#
# Aturan versi: setiap perubahan aplikasi (config, docker, installer, scripts, docker-compose) WAJIB menaikkan VERSI.
# Langkah "Periksa VERSI" menggagalkan build bila kode berubah tetapi VERSI masih sama dengan rilis yang sudah terbit.
# Setelah berkas terunggah, rilis diterbitkan ulang agar tanggalnya di halaman Releases ikut baru.
#
# Versi yang bisa dicocokkan: setiap VERSI juga mendapat rilis TETAP bertag v<VERSI> (mis. v2026.11.14) yang menunjuk
# commit build-nya, berisi installer online + ALDx-HapusTotal.exe + ALDx-SHA256.txt (sidik semua berkas, termasuk
# paket offline) dan catatan versi dari docs/31-catatan-versi.md. "terbaru" & "offline" tetap tautan bergulir.
name: rilis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rilis
  cancel-in-progress: true

jobs:
  online:
    runs-on: windows-latest
    outputs:
      versi: ${{ steps.bangun.outputs.versi }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Periksa VERSI sudah dinaikkan
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path config/sps_versi_aplikasi.py -Pattern '^VERSI\s*=\s*"([\d.]+)"').Matches[0].Groups[1].Value
          $lama = gh release view terbaru --json name,targetCommitish 2>$null | ConvertFrom-Json
          if (-not $lama -or $lama.name -notlike "*($v)*") { Write-Host "VERSI $v belum pernah dirilis: lanjut."; exit 0 }
          $ubah = git diff --name-only $lama.targetCommitish HEAD -- config docker installer scripts docker-compose.yml 2>$null
          if ($LASTEXITCODE -eq 0 -and $ubah) {
            Write-Host "::error::Kode aplikasi berubah tetapi VERSI masih $v. Naikkan VERSI di config/sps_versi_aplikasi.py (hari yang sama: $v.2) dan catat di docs/31-catatan-versi.md."
            $ubah | Select-Object -First 15 | ForEach-Object { Write-Host "  berubah: $_" }
            exit 1
          }
          Write-Host "VERSI $v sama dengan rilis, tetapi kode aplikasi tidak berubah: lanjut."; exit 0

      - name: Pasang Inno Setup bila belum ada
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Bangun ALDx-Setup.exe & ALDx-HapusTotal.exe
        id: bangun
        shell: pwsh
        run: |
          ./installer/setup/buat-installer.ps1
          $v = (Select-String -Path config/sps_versi_aplikasi.py -Pattern '^VERSI\s*=\s*"([\d.]+)"').Matches[0].Groups[1].Value
          "versi=$v" >> $env:GITHUB_OUTPUT
          Get-ChildItem installer/setup/Output | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: online
          path: installer/setup/Output/*.exe
          retention-days: 14

      - name: Terbitkan ke rilis "terbaru"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.bangun.outputs.versi }}"; $c = "$env:GITHUB_SHA".Substring(0, 7)
          $catatan = "ALDx $v (commit $c). Unduh ALDx-Setup.exe, klik dua kali, Next-Next. Memasang di atas versi lama: data & pengaturan tetap. ALDx-HapusTotal.exe = pembersih total. Panduan: CARA-PASANG.md; yang baru: docs/31-catatan-versi.md"
          gh release view terbaru *> $null
          if ($LASTEXITCODE -ne 0) { gh release create terbaru --title "ALDx terbaru ($v)" --notes $catatan --latest }
          else { gh release edit terbaru --title "ALDx terbaru ($v)" --notes $catatan --target $env:GITHUB_SHA }
          # Sidik SHA-256: pengguna bisa memastikan unduhan utuh & asli (Get-FileHash ALDx-Setup.exe).
          Get-ChildItem installer/setup/Output/*.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -Encoding ascii installer/setup/Output/ALDx-SHA256.txt
          gh release upload terbaru installer/setup/Output/ALDx-Setup.exe installer/setup/Output/ALDx-HapusTotal.exe installer/setup/Output/ALDx-SHA256.txt --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Terbitkan ulang (draf -> terbit) agar tanggal rilis di halaman Releases = tanggal build ini.
          $id = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/terbaru" --jq .id
          gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/releases/$id" -F draft=true --silent
          gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/releases/$id" -F draft=false -f tag_name=terbaru -f make_latest=true --silent
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Rilis terbaru gagal diterbitkan ulang (masih draf). Terbitkan lewat halaman Releases."; exit 1 }

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lapangkan disk runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Bangun & kumpulkan image (versi dari .env.example)
        run: |
          set -eu
          v() { grep -E "^$1=" .env.example | cut -d= -f2 | tr -d '\r'; }
          SS=$(v SUPERSET_VERSION)
          docker build docker --build-arg SUPERSET_VERSION=$SS -t sps-superset:$SS
          IMG="sps-superset:$SS redis:$(v REDIS_VERSI)-alpine postgres:$(v METADB_VERSI)-alpine clickhouse/clickhouse-server:$(v ENGINE_VERSI) nginx:$(v GATEWAY_VERSI)-alpine"
          for i in $IMG; do case $i in sps-*) ;; *) docker pull -q $i ;; esac; done
          mkdir -p offline
          docker save $IMG | gzip -1 > offline/aldx-images.tar.gz
          docker image rm $IMG >/dev/null
          curl -fsSL -o offline/DockerDesktopInstaller.exe "https://desktop.docker.com/win/main/amd64/Docker%20Desktop%20Installer.exe"
          ls -la offline

      - uses: actions/upload-artifact@v4
        with:
          name: offline
          path: offline/
          compression-level: 0
          retention-days: 3

  offline:
    needs: [image, online]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Periksa catatan versi
        shell: pwsh
        run: ./scripts/catatan-rilis.ps1 -Versi "${{ needs.online.outputs.versi }}" -Keluar catatan-rilis.md

      - uses: actions/download-artifact@v4
        with:
          name: offline
          path: offline

      - uses: actions/download-artifact@v4
        with:
          name: online
          path: online

      - name: Pasang Inno Setup bila belum ada
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Bangun ALDx-Setup-Offline (+ .bin)
        shell: pwsh
        run: |
          ./installer/setup/buat-installer.ps1 -HanyaOffline -PakaiImageAda
          Copy-Item online/ALDx-HapusTotal.exe installer/setup/Output/
          Get-ChildItem installer/setup/Output | Format-Table Name, Length
          if (-not (Get-ChildItem installer/setup/Output/ALDx-Setup-Offline-*.bin)) { throw "Berkas .bin tidak terbentuk: paket offline tidak lengkap." }

      - name: Terbitkan ke rilis "offline"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ needs.online.outputs.versi }}"; $c = "$env:GITHUB_SHA".Substring(0, 7)
          $catatan = "ALDx offline $v (commit $c): pasang TANPA internet. Unduh SEMUA berkas (ALDx-Setup-Offline.exe dan semua ALDx-Setup-Offline-*.bin) ke SATU folder, lalu klik dua kali ALDx-Setup-Offline.exe. Termasuk Docker Desktop Installer (butuh hak admin). Panduan: CARA-PASANG.md"
          gh release view offline *> $null
          if ($LASTEXITCODE -ne 0) { gh release create offline --title "ALDx offline ($v)" --notes $catatan --latest=false }
          else { gh release edit offline --title "ALDx offline ($v)" --notes $catatan --target $env:GITHUB_SHA }
          # Sidik semua berkas versi ini (online + offline) dalam satu daftar; ikut ke rilis "offline" & rilis tetap v<VERSI>.
          @(Get-ChildItem installer/setup/Output/* -Exclude ALDx-SHA256.txt) + @(Get-Item online/ALDx-Setup.exe) | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -Encoding ascii installer/setup/Output/ALDx-SHA256.txt
          $baru = Get-ChildItem installer/setup/Output/*
          gh release upload offline $baru.FullName --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Berkas lama yang tidak ada lagi di rilis ini (mis. .bin ke-2 dari versi sebelumnya) dihapus setelah unggahan berhasil.
          gh release view offline --json assets --jq '.assets[].name' | Where-Object { $_ -notin $baru.Name } | ForEach-Object { gh release delete-asset offline $_ -y }
          $id = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/offline" --jq .id
          gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/releases/$id" -F draft=true --silent
          gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/releases/$id" -F draft=false -f tag_name=offline -f make_latest=false --silent
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Rilis offline gagal diterbitkan ulang (masih draf). Terbitkan lewat halaman Releases."; exit 1 }

      - name: Terbitkan rilis tetap v<VERSI> (cocok dengan tag git & commit)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ needs.online.outputs.versi }}"; $tag = "v$v"; $o = "installer/setup/Output"
          $berkas = @("online/ALDx-Setup.exe", "$o/ALDx-HapusTotal.exe", "$o/ALDx-SHA256.txt")
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            # Tag baru menunjuk commit build ini. Bukan "Latest": tombol unduh utama tetap rilis "terbaru".
            gh release create $tag $berkas --target $env:GITHUB_SHA --title "ALDx $v" --notes-file catatan-rilis.md --latest=false
          } else {
            # VERSI sama dibangun ulang (hanya dokumentasi berubah): tag tidak dipindah, berkas & catatan diperbarui.
            gh release edit $tag --notes-file catatan-rilis.md
            gh release upload $tag $berkas --clobber
          }
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Rilis $tag gagal dibuat."; exit 1 }
